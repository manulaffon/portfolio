<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.data.site.name }}{% else %}{{ site.data.site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.data.site.description | strip_newlines | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <!-- Navigation -->
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="{{ '/' | relative_url }}" class="logo">{{ site.data.site.name }}</a>
      <nav class="nav" id="nav">
        <a href="{{ '/#work' | relative_url }}" class="nav-link">Work</a>
        <a href="{{ '/#about' | relative_url }}" class="nav-link">About</a>
        <a href="{{ '/#contact' | relative_url }}" class="nav-link">Contact</a>
      </nav>
      <button class="menu-btn" id="menu-btn" aria-label="Menu">
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

{{ content }}
  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-inner">
      <span class="footer-logo">{{ site.data.site.name }}</span>
      <span class="footer-copy">© <span id="year"></span></span>
    </div>
  </footer>

  <script src="{{ '/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
