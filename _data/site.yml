name: Emmanuel de Mazières
title: Emmanuel de Mazières — Industrial Designer
description: Emmanuel de Mazieres is an industrial designer who treats form, material and texture as a language, designing products that show what they do and how they belong where they live.
hero_title: Iconic Design
hero_tagline: Design is the language objects speak.
hero_subtitle: Industrial designer shaping products whose form, materials and textures say what they do — and how they belong in the places people live.
about_label: About
about_heading: Objects that explain themselves
about_text: |-
  We read objects long before we use them. A soft edge invites the hand, warm wood says home, a knit surface says calm. Form, shape, material and texture make up a vocabulary we all share, and the most iconic products speak it so naturally that they become part of everyday culture.

  That vocabulary is what Emmanuel de Mazieres works in. Each project starts with what the product needs to communicate: what it does, how it wants to be touched, and how it should sit in its surroundings. From there, every proportion, surface and material is chosen to say exactly that, clearly and without noise.

  He has spent more than a decade doing this for consumer electronics, wearables and everyday objects, including work at IDEO, fuseproject and other leading studios, and most recently Amazon’s Echo Time and Alexa Photo Frame.
